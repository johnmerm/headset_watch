<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 240px;
      padding: 12px;
      margin: 0;
      background-color: #f3f2f1;
      color: #323130;
    }
    h3 { margin-top: 0; color: #0078d4; font-size: 14px; border-bottom: 1px solid #dee2e6; padding-bottom: 6px;}
    .control-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .flex {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      flex-grow: 1;
    }
    span {
      font-size: 11px;
      min-width: 30px;
      text-align: right;
    }
    button {
      width: 100%;
      background-color: #0078d4;
      color: white;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }
    button:hover { background-color: #005a9e; }
  </style>
</head>
<body>
  <h3>Audio Cue Profiles</h3>

  <div class="control-group">
    <label for="gain">Volume (Gain)</label>
    <div class="flex">
      <input type="range" id="gain" min="0.05" max="0.8" step="0.05" value="0.15">
      <span id="gain-val">15%</span>
    </div>
  </div>

  <div class="control-group">
    <label for="duration">Duration (Seconds)</label>
    <div class="flex">
      <input type="range" id="duration" min="0.1" max="0.6" step="0.05" value="0.2">
      <span id="duration-val">0.2s</span>
    </div>
  </div>

  <button id="test-btn">Test Audio Configuration</button>

  <script src="popup.js"></script>
</body>
</html>
